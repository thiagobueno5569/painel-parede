<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Assistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #eef2fa;
    --suave: #93a0b8;
    --apagado: #5d6880;
    --vidro: rgba(16, 21, 33, .58);
    --borda: rgba(255, 255, 255, .07);
    --acento: #7fd8ff;
    --prova: #ff7a8f;
    --entrega: #ffbd5c;
    --semaula: #a3afc4;
    --extra: #5ee6d6;
    --dx: 0px; --dy: 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #000; color: var(--tinta);
    font-family: 'Outfit', -apple-system, Roboto, sans-serif; font-weight: 300;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 15% 0%, rgba(var(--c1), .20), transparent 60%),
      radial-gradient(100% 80% at 100% 100%, rgba(var(--c2), .16), transparent 60%),
      #05070c;
    transition: opacity 2.5s ease;
  }
  body.modo-noite::before { opacity: 0; }
  #ceu { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .camada {
    position: fixed; inset: 0; z-index: 2; opacity: 0; pointer-events: none;
    transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.2, .8, .2, 1);
  }
  body.modo-noite #noite,
  body.modo-aguardando #aguarda,
  body.modo-descanso #descanso,
  body.modo-painel #painel { opacity: 1; pointer-events: auto; }
  body.modo-painel #painel { transform: none; }
  #painel { transform: scale(.985); }

  /* ---------- NOITE ---------- */
  #noite { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 14vh; }
  .hora-noite {
    font-weight: 100; font-size: 13vw; letter-spacing: -.02em; line-height: 1;
    color: rgb(190, 202, 230); opacity: .13; transition: opacity 1.6s ease, text-shadow 1.6s ease;
    transform: translate(var(--dx), var(--dy)); font-variant-numeric: tabular-nums;
  }
  .data-noite { font-size: 1.6vw; letter-spacing: .3em; text-transform: uppercase; color: var(--suave); opacity: 0; transition: opacity 1.6s ease; margin-top: 1.5vh; transform: translate(var(--dx), var(--dy)); }
  body.espiando .hora-noite { opacity: .62; text-shadow: 0 0 40px rgba(170, 190, 255, .25); }
  body.espiando .data-noite { opacity: .45; }

  /* ---------- AGUARDANDO (manhã) ---------- */
  #aguarda, #descanso { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .hora-centro {
    font-weight: 200; font-size: 11vw; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums;
    transform: translate(var(--dx), var(--dy));
    background: linear-gradient(180deg, #fff 30%, rgba(255, 255, 255, .55));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sauda-centro { font-size: 2.4vw; font-weight: 300; color: var(--tinta); opacity: .85; margin-top: 2vh; transform: translate(var(--dx), var(--dy)); }
  .dica {
    position: absolute; bottom: 7vh; font-size: 1.3vw; letter-spacing: .35em; text-transform: uppercase; color: var(--suave);
    animation: respira 3.5s ease-in-out infinite;
  }
  @keyframes respira { 0%, 100% { opacity: .25; } 50% { opacity: .75; } }
  .linha-desc { margin-top: 2.5vh; font-size: 1.9vw; color: var(--suave); transform: translate(var(--dx), var(--dy)); }
  .linha-desc b { color: var(--tinta); font-weight: 400; }

  /* ---------- PAINEL ---------- */
  #painel { display: grid; grid-template-columns: 40% 1fr; gap: 2.2vw; padding: 4.5vh 3.2vw 9vh; }
  body.noturno #painel { opacity: .5; }
  .col { display: flex; flex-direction: column; gap: 2vh; min-height: 0; }
  .sauda { font-size: 1.9vw; color: var(--suave); font-weight: 300; }
  .sauda b { color: var(--tinta); font-weight: 400; }
  .hora { font-weight: 100; font-size: 12.5vw; line-height: .9; letter-spacing: -.04em; margin: .6vh 0 .4vh -.5vw; font-variant-numeric: tabular-nums; }
  .hora span { opacity: .45; animation: pisca 2s steps(1) infinite; }
  @keyframes pisca { 50% { opacity: .12; } }
  .data { font-size: 1.9vw; color: var(--suave); text-transform: capitalize; letter-spacing: .02em; }

  .vidro {
    background: var(--vidro); border: 1px solid var(--borda); border-radius: 1.8vw;
    padding: 2.3vh 1.9vw; box-shadow: 0 20px 60px -30px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .vidro h3 {
    font-size: 1.05vw; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--apagado);
    margin-bottom: 1.6vh; display: flex; justify-content: space-between; align-items: center;
  }
  .vidro h3 em { font-style: normal; letter-spacing: 0; color: var(--suave); font-weight: 400; font-size: 1.2vw; }

  .clima { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 1.8vw; }
  .clima .ico { font-size: 5.6vw; line-height: 1; filter: drop-shadow(0 0 20px rgba(255, 220, 140, .25)); }
  .clima .t { font-size: 5vw; font-weight: 200; line-height: 1; }
  .clima .d { font-size: 1.5vw; color: var(--suave); margin-top: .6vh; }
  .chuva { margin-top: 1.4vh; display: flex; align-items: center; gap: .8vw; font-size: 1.25vw; color: var(--suave); }
  .barra { flex: 1; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .07); overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #5aa9ff, #7fd8ff); }
  .amanha { grid-column: 1 / -1; display: flex; justify-content: space-between; border-top: 1px solid var(--borda); padding-top: 1.4vh; font-size: 1.35vw; color: var(--suave); }

  .proximo { font-size: 1.6vw; line-height: 1.45; }
  .proximo .rot { font-size: 1.05vw; letter-spacing: .28em; text-transform: uppercase; color: var(--apagado); font-weight: 500; }
  .proximo .tit { font-size: 2.1vw; font-weight: 400; margin-top: .6vh; }
  .proximo .em { color: var(--acento); }
  .add { font-size: 1.25vw; color: var(--suave); }
  .add b { color: #8ff0b4; font-weight: 400; }

  .acoes { display: flex; gap: .8vw; margin-top: auto; }
  .acoes button {
    font-family: inherit; font-size: 1.35vw; font-weight: 400; color: var(--tinta);
    background: rgba(255, 255, 255, .05); border: 1px solid var(--borda); border-radius: 99px;
    padding: 1.6vh 1.8vw; display: flex; align-items: center; gap: .7vw;
  }
  .acoes button.pri { background: linear-gradient(135deg, rgba(127, 216, 255, .22), rgba(160, 130, 255, .18)); border-color: rgba(127, 216, 255, .3); }
  .acoes button:active { transform: scale(.96); }
  body.falando .acoes button.pri { animation: onda 1.4s ease-in-out infinite; }
  @keyframes onda { 50% { box-shadow: 0 0 0 10px rgba(127, 216, 255, 0); background: rgba(127, 216, 255, .35); } }

  .lista { list-style: none; }
  .lista li { display: grid; grid-template-columns: 6.4vw 1fr; gap: 1.2vw; align-items: baseline; padding: 1.15vh 0; font-size: 1.6vw; }
  .lista li + li { border-top: 1px solid rgba(255, 255, 255, .04); }
  .lista .h { color: var(--suave); font-size: 1.35vw; font-variant-numeric: tabular-nums; }
  .lista .s { color: var(--apagado); font-size: 1.25vw; }
  .vazio { color: var(--apagado); font-size: 1.5vw; padding: .6vh 0; }

  .tl li { grid-template-columns: 6.4vw 1.4vw 1fr; }
  .tl .ponto { width: .75vw; height: .75vw; border-radius: 50%; background: var(--apagado); align-self: center; justify-self: center; }
  .tl li.agora .ponto { background: var(--acento); box-shadow: 0 0 0 .45vw rgba(127, 216, 255, .18), 0 0 18px var(--acento); }
  .tl li.agora .h { color: var(--acento); }
  .tl li.prox .ponto { background: var(--tinta); }
  .tl li.passou { opacity: .32; }

  #fac li { grid-template-columns: 9.6vw 1fr; }
  .tag { display: inline-block; font-size: 1vw; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; padding: .35vh .7vw; border-radius: 99px; margin-right: .6vw; vertical-align: .15em; }
  .tag.prova { color: var(--prova); background: rgba(255, 122, 143, .12); }
  .tag.entrega { color: var(--entrega); background: rgba(255, 189, 92, .12); }
  .tag.sem_aula { color: var(--semaula); background: rgba(163, 175, 196, .12); }
  .tag.reposicao { color: var(--extra); background: rgba(94, 230, 214, .12); }
  #fac li.urgente .h { color: var(--entrega); font-weight: 500; }

  .flex1 { flex: 1; min-height: 0; overflow: hidden; }

  /* notícias */
  .ticker {
    position: fixed; left: 0; right: 0; bottom: 0; height: 6.5vh; z-index: 3; display: flex; align-items: center; overflow: hidden;
    border-top: 1px solid var(--borda); background: rgba(5, 7, 12, .72); opacity: 0; transition: opacity 1.4s;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  body.modo-painel .ticker { opacity: 1; }
  body.noturno .ticker { opacity: .4; }
  .faixa { white-space: nowrap; font-size: 1.45vw; color: var(--suave); animation: corre linear infinite; padding-left: 100%; }
  .faixa b { color: var(--tinta); font-weight: 400; }
  .faixa i { font-style: normal; color: var(--apagado); margin: 0 2.4vw; }
  @keyframes corre { to { transform: translateX(-100%); } }

  .status { position: fixed; top: 1.6vh; right: 2vw; z-index: 4; font-size: 1.05vw; color: var(--apagado); opacity: 0; transition: opacity .6s; }
  body.modo-painel .status { opacity: 1; }

  /* véu: escurece quando não dá pra controlar o brilho da tela */
  #veu { position: fixed; inset: 0; z-index: 9; background: #000; pointer-events: none; opacity: 0; transition: opacity 1.6s ease; }
  #flash { position: fixed; inset: 0; z-index: 8; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .35), transparent 60%); }
  #flash.on { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

  #config { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: #05070c; }
  #config.on { display: flex; }
  #config div { width: 60vw; font-size: 1.6vw; line-height: 1.6; color: var(--suave); }
  #config input { width: 100%; margin: 1vh 0 2vh; padding: 1.4vh 1vw; font: inherit; color: var(--tinta); background: rgba(255,255,255,.05); border: 1px solid var(--borda); border-radius: 1vw; }
  #config button { font: inherit; padding: 1.4vh 2vw; border-radius: 99px; border: 0; background: var(--acento); color: #05070c; }
</style>
</head>
<body class="modo-painel">
<canvas id="ceu"></canvas>

<!-- noite -->
<section class="camada" id="noite">
  <div class="hora-noite" id="horaNoite">--:--</div>
  <div class="data-noite" id="dataNoite"></div>
</section>

<!-- manhã: esperando movimento -->
<section class="camada" id="aguarda">
  <div class="hora-centro" id="horaAguarda">--:--</div>
  <div class="sauda-centro" id="saudaAguarda">Bom dia</div>
  <div class="dica">acene para começar o dia</div>
</section>

<!-- descanso durante o dia -->
<section class="camada" id="descanso">
  <div class="hora-centro" id="horaDesc">--:--</div>
  <div class="linha-desc" id="linhaDesc"></div>
</section>

<!-- painel -->
<main class="camada" id="painel">
  <section class="col">
    <div>
      <div class="sauda" id="sauda">&nbsp;</div>
      <div class="hora" id="hora">--<span>:</span>--</div>
      <div class="data" id="data">&nbsp;</div>
    </div>
    <div class="vidro clima" id="clima"><div class="vazio">Carregando o clima…</div></div>
    <div class="vidro proximo" id="proximo"></div>
    <div class="add" id="add"></div>
    <div class="acoes">
      <button class="pri" id="bFalar">◉&nbsp; Ouvir resumo</button>
      <button id="bParar" aria-label="Parar">■</button>
      <button id="bEmails" aria-label="Ler e-mails">↻&nbsp; E-mails</button>
    </div>
  </section>
  <section class="col">
    <div class="vidro flex1"><h3>Hoje <em id="qtdHoje"></em></h3><ol class="lista tl" id="hoje"></ol></div>
    <div class="vidro" id="cFac" style="display:none"><h3>Faculdade <em>próximos 7 dias</em></h3><ul class="lista" id="fac"></ul></div>
    <div class="vidro"><h3>E-mails importantes <em id="qtdEmails"></em></h3><ul class="lista" id="emails"></ul></div>
  </section>
</main>

<div class="ticker"><div class="faixa" id="faixa"></div></div>
<div class="status" id="status"></div>
<div id="flash"></div>
<div id="veu"></div>

<div id="config"><div>
  Cole aqui o endereço do seu app da Web (termina em <b>/exec</b>) e a sua chave do tablet.
  <input id="cfgApi" placeholder="https://script.google.com/macros/s/…/exec">
  <input id="cfgK" placeholder="chave do tablet">
  <button id="cfgOk">Salvar</button>
</div></div>

<script>
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
var TPL = { k: '<?!= k ?>', acordar: '<?!= horaAcordar ?>', dormir: '<?!= horaDormir ?>' };
var ABRE = '<' + '?';
function tplOk(v) { return v && v.indexOf(ABRE) !== 0; }
function lsGet(c) { try { return localStorage.getItem(c); } catch (e) { return null; } }
function lsSet(c, v) { try { localStorage.setItem(c, v); } catch (e) {} }
var memoria = {};
function guardar(c, v) { memoria[c] = v; lsSet(c, v); }
function ler(c) { return lsGet(c) || memoria[c] || null; }

var params = {};
location.search.replace(/^\?/, '').split('&').forEach(function (p) {
  if (!p) return; var i = p.indexOf('=');
  params[decodeURIComponent(i < 0 ? p : p.slice(0, i))] = i < 0 ? '' : decodeURIComponent(p.slice(i + 1));
});
var MODO_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var CFG = {
  api: params.api || ler('api'),
  k: tplOk(TPL.k) ? TPL.k : (params.k || ler('k')),
  acordar: tplOk(TPL.acordar) ? TPL.acordar : (ler('acordar') || '07:00'),
  dormir: tplOk(TPL.dormir) ? TPL.dormir : (ler('dormir') || '22:30'),
  inativoMin: 4   // minutos sem ninguém até voltar para as partículas
};
if (params.api) guardar('api', params.api);
if (params.k) guardar('k', params.k);
// esconde o endereço e a chave da barra do navegador (ficam guardados no tablet)
if ((params.api || params.k) && !MODO_GAS && window.history && history.replaceState) {
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}

// tela cheia: some a barra do navegador (no primeiro toque, exigência do navegador)
function telaCheia() {
  var el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  try {
    var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' });
    if (p && p.catch) p.catch(function () {});
  } catch (e) {}
}

/* =========================================================
   UTIL
   ========================================================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function dois(n) { return (n < 10 ? '0' : '') + n; }
function hhmm(d) { return dois(d.getHours()) + ':' + dois(d.getMinutes()); }
function hojeStr() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function minDia(s) { var p = String(s).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function agoraMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function status(t) { $('status').textContent = t || ''; }
var DSEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
var MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

/* =========================================================
   DADOS
   ========================================================= */
var dados = null;
function buscar(acao) {
  return new Promise(function (ok, falha) {
    if (MODO_GAS) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(falha);
      if (acao === 'escanear') r.escanearAgora(CFG.k); else r.dadosTablet(CFG.k);
      return;
    }
    if (!CFG.api || !CFG.k) { $('config').classList.add('on'); return falha(new Error('sem configuração')); }
    var url = CFG.api + (CFG.api.indexOf('?') >= 0 ? '&' : '?') + 'formato=json&k=' + encodeURIComponent(CFG.k) + (acao === 'escanear' ? '&escanear=1' : '');
    fetch(url).then(function (r) { return r.json(); }).then(ok, falha);
  });
}
function carregar(acao) {
  return buscar(acao).then(function (d) {
    dados = d;
    if (!tplOk(TPL.acordar) && d.horaAcordar) { CFG.acordar = d.horaAcordar; guardar('acordar', d.horaAcordar); }
    if (!tplOk(TPL.dormir) && d.horaDormir) { CFG.dormir = d.horaDormir; guardar('dormir', d.horaDormir); }
    render(d);
    status('atualizado às ' + hhmm(new Date()));
    return d;
  }, function (e) {
    status('sem conexão — tentando de novo');
    if (dados) return dados;
    throw e;
  });
}

/* =========================================================
   PAINEL
   ========================================================= */
function saudacao() { var h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }

function render(d) {
  var nome = d.nome && d.nome !== 'Você' ? ', <b>' + esc(d.nome) + '</b>' : '';
  $('sauda').innerHTML = saudacao() + nome;
  $('saudaAguarda').innerHTML = saudacao() + nome;
  $('data').textContent = d.dataTexto;

  var c = d.clima;
  $('clima').innerHTML = c ?
    '<div class="ico">' + c.icone + '</div>' +
    '<div><div class="t">' + c.agora + '°</div><div class="d">' + esc(c.descricao) + ' · sensação ' + c.sensacao + '°</div>' +
    '<div class="chuva">↑' + c.max + '° ↓' + c.min + '° &nbsp;💧<div class="barra"><i style="width:' + c.chuva + '%"></i></div>' + c.chuva + '%</div></div>' +
    '<div class="amanha"><span>Amanhã</span><span>' + c.amanha.icone + ' ' + esc(c.amanha.descricao) + '</span><span>' + c.amanha.max + '° / ' + c.amanha.min + '°</span></div>'
    : '<div class="vazio">Clima indisponível</div>';

  var agora = Date.now(), proxMarcado = false;
  $('qtdHoje').textContent = d.hoje.length ? d.hoje.length + (d.hoje.length === 1 ? ' compromisso' : ' compromissos') : '';
  $('hoje').innerHTML = d.hoje.length ? d.hoje.slice(0, 7).map(function (e) {
    var cls = '';
    if (!e.diaInteiro && e.fim < agora) cls = 'passou';
    else if (!e.diaInteiro && e.inicio <= agora) cls = 'agora';
    else if (!e.diaInteiro && !proxMarcado) { cls = 'prox'; proxMarcado = true; }
    return '<li class="' + cls + '"><span class="h">' + esc(e.hora) + '</span><span class="ponto"></span>' +
      '<span>' + esc(e.titulo) + (e.local ? ' <span class="s">· ' + esc(e.local) + '</span>' : '') + '</span></li>';
  }).join('') : '<li class="vazio" style="display:block">Agenda livre hoje ✨</li>';

  var fac = d.faculdade || [];
  $('cFac').style.display = fac.length ? '' : 'none';
  var NOMES = { prova: 'Prova', entrega: 'Entrega', sem_aula: 'Sem aula', reposicao: 'Extra' };
  $('fac').innerHTML = fac.slice(0, 4).map(function (e) {
    var urg = e.dia === 'Hoje' || e.dia === 'Amanhã';
    return '<li class="' + (urg ? 'urgente' : '') + '"><span class="h">' + esc(e.dia) + (e.hora ? ' · ' + esc(e.hora) : '') + '</span>' +
      '<span><span class="tag ' + esc(e.tipo) + '">' + (NOMES[e.tipo] || '') + '</span>' + esc(e.resto) + '</span></li>';
  }).join('');

  $('qtdEmails').textContent = d.emails.total ? d.emails.total + ' não lidos' : '';
  $('emails').innerHTML = d.emails.lista.length ? d.emails.lista.slice(0, 3).map(function (m) {
    return '<li><span class="h">' + esc(m.hora.slice(6)) + '</span><span>' + esc(m.de) + ' <span class="s">· ' + esc(m.assunto) + '</span></span></li>';
  }).join('') : '<li class="vazio" style="display:block">Caixa em dia</li>';

  $('add').innerHTML = d.adicionados.length ?
    '✦ Coloquei na agenda: <b>' + d.adicionados.slice(0, 3).map(function (a) { return esc(a.titulo); }).join('</b>, <b>') + '</b>' : '';

  var n = d.noticias || [];
  var faixa = $('faixa');
  faixa.innerHTML = n.map(function (x) { return '<b>' + esc(x.titulo) + '</b> ' + esc(x.fonte); }).join('<i>✦</i>');
  faixa.style.animationDuration = Math.max(40, faixa.textContent.length * 0.22) + 's';

  proximo();
}

function proximo() {
  if (!dados) return;
  var agora = Date.now();
  var p = dados.hoje.filter(function (e) { return !e.diaInteiro && e.fim > agora; })[0];
  var html, linha;
  if (p) {
    var min = Math.round((p.inicio - agora) / 60000);
    var quando = min <= 0 ? 'acontecendo agora' : min < 60 ? 'em ' + min + ' min' : 'em ' + Math.floor(min / 60) + 'h' + (min % 60 ? dois(min % 60) : '');
    html = '<div class="rot">Próximo</div><div class="tit">' + esc(p.titulo) + '</div><div>' + esc(p.hora) + ' · <span class="em">' + quando + '</span></div>';
    linha = '<b>' + esc(p.titulo) + '</b> · ' + esc(p.hora) + ' · ' + quando;
  } else if (dados.amanha && dados.amanha.length) {
    var a = dados.amanha[0];
    html = '<div class="rot">Amanhã</div><div class="tit">' + esc(a.titulo) + '</div><div>' + esc(a.hora) + '</div>';
    linha = 'Amanhã: <b>' + esc(a.titulo) + '</b> · ' + esc(a.hora);
  } else {
    html = '<div class="rot">Próximo</div><div class="tit">Nada mais na agenda hoje</div>';
    linha = '';
  }
  $('proximo').innerHTML = html;
  var c = dados.clima;
  $('linhaDesc').innerHTML = (c ? c.icone + ' ' + c.agora + '°' + (linha ? '&nbsp;&nbsp;·&nbsp;&nbsp;' : '') : '') + linha;
}

/* =========================================================
   VOZ
   ========================================================= */
function temFully() { try { return typeof fully !== 'undefined' && !!fully.textToSpeech; } catch (e) { return false; } }
function falar(texto) {
  parar();
  document.body.classList.add('falando');
  if (temFully()) { fully.textToSpeech(texto, 'pt_BR'); setTimeout(function () { document.body.classList.remove('falando'); }, Math.min(90000, texto.length * 70)); return; }
  var s = window.speechSynthesis; if (!s) return;
  var vozes = s.getVoices();
  var voz = vozes.filter(function (v) { return /pt[-_]BR/i.test(v.lang); })[0] || vozes.filter(function (v) { return /^pt/i.test(v.lang); })[0];
  var frases = texto.match(/[^.!?]+[.!?]*/g) || [texto];
  frases.forEach(function (f, i) {
    var u = new SpeechSynthesisUtterance(f.trim());
    u.lang = 'pt-BR'; if (voz) u.voice = voz; u.rate = 1.02;
    if (i === frases.length - 1) u.onend = function () { document.body.classList.remove('falando'); };
    s.speak(u);
  });
}
function parar() {
  document.body.classList.remove('falando');
  try { if (typeof fully !== 'undefined' && fully.stopTextToSpeech) fully.stopTextToSpeech(); } catch (e) {}
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

/* =========================================================
   BRILHO
   ========================================================= */
var veuAtual = 0;
function brilho(nivel, veu) {          // nivel 0–255 (tela) · veu 0–1 (escurecer por CSS quando não há controle)
  var ok = false;
  try { if (typeof fully !== 'undefined' && fully.setScreenBrightness) { fully.setScreenBrightness(nivel); ok = true; } } catch (e) {}
  veuAtual = ok ? 0 : (veu || 0);
  $('veu').style.opacity = veuAtual;
  mudouBrilhoEm = Date.now();
}

/* =========================================================
   CÉU (partículas, estrelas e lua)
   ========================================================= */
var cv = $('ceu'), cx = cv.getContext('2d'), W = 0, H = 0;
var particulas = [], estrelas = [], cadente = null;
var alvo = { vel: .25, alfa: .25, cauda: .18, raioMin: .12 };
var atual = { vel: .25, alfa: 0, cauda: .18, raioMin: .12 };
var explosao = 0;

function tamanho() {
  W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
  criarParticulas(); criarEstrelas();
}
function criarParticulas() {
  particulas = [];
  var m = Math.min(W, H);
  for (var i = 0; i < 150; i++) {
    var r = Math.pow(Math.random(), .7);
    particulas.push({
      r: r, a: Math.random() * Math.PI * 2,
      w: (.00022 + Math.random() * .00028) / (r * .8 + .35),
      s: Math.random() * 1.6 + .5, h: Math.random(), f: Math.random() * 6.28,
      out: 0, alfa: Math.random() * .6 + .4
    });
  }
}
function criarEstrelas() {
  estrelas = [];
  var n = Math.round(W * H / 22000);
  for (var i = 0; i < n; i++) {
    estrelas.push({
      x: Math.random() * W, y: Math.random() * H * .78,
      r: Math.random() < .12 ? 1.3 : Math.random() * .7 + .35,
      b: Math.random() * .3 + .1, v: Math.random() * .0012 + .0003, f: Math.random() * 6.28
    });
  }
}

// cores conforme a hora: amanhecer âmbar/rosa · dia ciano · fim de tarde violeta
function paleta() {
  var h = new Date().getHours();
  if (h < 10) return [[255, 176, 102], [255, 120, 160]];
  if (h < 17) return [[110, 210, 255], [140, 150, 255]];
  return [[180, 130, 255], [255, 120, 190]];
}
function aplicarPaletaFundo() {
  var p = paleta();
  document.documentElement.style.setProperty('--c1', p[0].join(','));
  document.documentElement.style.setProperty('--c2', p[1].join(','));
}

// fase da lua (0 = nova, .5 = cheia)
function faseLua(d) {
  var ciclo = 2551442.877, novaRef = Date.UTC(2000, 0, 6, 18, 14) / 1000;
  var f = ((d.getTime() / 1000 - novaRef) % ciclo) / ciclo;
  return f < 0 ? f + 1 : f;
}
var HEMISFERIO_SUL = true;
function desenharLua(x, y, r, fase, a) {
  var halo = cx.createRadialGradient(x, y, r * .9, x, y, r * 5);
  halo.addColorStop(0, 'rgba(200,210,255,' + (.07 * a) + ')');
  halo.addColorStop(1, 'rgba(200,210,255,0)');
  cx.fillStyle = halo; cx.beginPath(); cx.arc(x, y, r * 5, 0, 6.2832); cx.fill();
  cx.fillStyle = 'rgba(110,120,150,' + (.10 * a) + ')';           // luz cinérea (parte escura)
  cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
  var k = Math.cos(fase * 2 * Math.PI);
  var lado = fase < .5 ? 1 : -1; if (HEMISFERIO_SUL) lado = -lado;
  cx.save(); cx.translate(x, y); cx.scale(lado, 1);
  cx.beginPath(); cx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
  var rx = Math.max(.01, r * Math.abs(k));
  if (k > 0) cx.ellipse(0, 0, rx, r, 0, Math.PI / 2, -Math.PI / 2, true);
  else cx.ellipse(0, 0, rx, r, 0, Math.PI / 2, Math.PI * 1.5, false);
  cx.closePath();
  var g = cx.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r);
  g.addColorStop(0, 'rgba(250,247,236,' + (.9 * a) + ')');
  g.addColorStop(1, 'rgba(214,210,196,' + (.75 * a) + ')');
  cx.fillStyle = g; cx.fill();
  cx.restore();
}

var desloc = { x: 0, y: 0 };   // anti-marcas na tela AMOLED: tudo anda uns pixels por minuto
function cenaNoite(t) {
  cx.clearRect(0, 0, W, H);
  var olhar = document.body.classList.contains('espiando') ? 1 : 0;
  brilhoNoite += (olhar - brilhoNoite) * .04;
  var ganho = .75 + brilhoNoite * .9;
  for (var i = 0; i < estrelas.length; i++) {
    var e = estrelas[i];
    var a = e.b * (.5 + .5 * Math.sin(t * e.v + e.f)) * ganho;
    cx.fillStyle = 'rgba(215,225,255,' + a.toFixed(3) + ')';
    cx.beginPath(); cx.arc(e.x + desloc.x * .3, e.y + desloc.y * .3, e.r, 0, 6.2832); cx.fill();
  }
  // estrela cadente rara e discreta
  if (!cadente && Math.random() < .00035) {
    cadente = { x: Math.random() * W * .6 + W * .1, y: Math.random() * H * .3, vx: 5 + Math.random() * 3, vy: 1.6 + Math.random(), v: 1 };
  }
  if (cadente) {
    var c = cadente;
    var gr = cx.createLinearGradient(c.x, c.y, c.x - c.vx * 14, c.y - c.vy * 14);
    gr.addColorStop(0, 'rgba(230,236,255,' + (.35 * c.v) + ')'); gr.addColorStop(1, 'rgba(230,236,255,0)');
    cx.strokeStyle = gr; cx.lineWidth = 1.2; cx.beginPath(); cx.moveTo(c.x, c.y); cx.lineTo(c.x - c.vx * 14, c.y - c.vy * 14); cx.stroke();
    c.x += c.vx; c.y += c.vy; c.v -= .012;
    if (c.v <= 0) cadente = null;
  }
  var r = Math.min(W, H) * .052;
  desenharLua(W * .79 + desloc.x, H * .2 + desloc.y, r, faseLua(new Date()), .5 + brilhoNoite * .5);
}
var brilhoNoite = 0;

function cenaParticulas(t, dt) {
  cx.clearRect(0, 0, W, H);
  ['vel', 'alfa', 'cauda', 'raioMin'].forEach(function (k) { atual[k] += (alvo[k] - atual[k]) * .03; });
  var pal = paleta(), m = Math.min(W, H);
  var cxC = W / 2 + desloc.x, cyC = H / 2 + desloc.y;
  var rMin = m * atual.raioMin, rMax = Math.max(W, H) * .62;
  cx.globalCompositeOperation = 'lighter';
  cx.lineCap = 'round';
  explosao *= .965;
  for (var i = 0; i < particulas.length; i++) {
    var p = particulas[i];
    p.a += p.w * dt * atual.vel * (1 + explosao * 6);
    p.out += explosao * .018 * (1 - p.out);
    p.out *= .992;
    var raio = rMin + p.r * (rMax - rMin) + Math.sin(t * .0004 + p.f) * m * .012 + p.out * m * .9;
    var cor = p.h < .5 ? pal[0] : pal[1];
    var a = atual.alfa * p.alfa * (1 - Math.min(1, p.out * 1.2));
    if (a < .01) continue;
    var cauda = Math.min(1.2, atual.cauda * (1 + explosao * 3));
    cx.strokeStyle = 'rgba(' + cor[0] + ',' + cor[1] + ',' + cor[2] + ',' + (a * .55).toFixed(3) + ')';
    cx.lineWidth = p.s;
    cx.beginPath();
    cx.ellipse(cxC, cyC, raio * 1.12, raio * .86, 0, p.a - cauda * (.5 + p.w * 2500), p.a, false);
    cx.stroke();
    var x = cxC + Math.cos(p.a) * raio * 1.12, y = cyC + Math.sin(p.a) * raio * .86;
    cx.fillStyle = 'rgba(' + cor[0] + ',' + cor[1] + ',' + cor[2] + ',' + a.toFixed(3) + ')';
    cx.beginPath(); cx.arc(x, y, p.s * 1.3, 0, 6.2832); cx.fill();
  }
  cx.globalCompositeOperation = 'source-over';
}

var ultimoQuadro = 0, ultimoT = 0;
function animar(t) {
  requestAnimationFrame(animar);
  var fps = estado === 'noite' ? 20 : estado === 'painel' ? 30 : 45;
  if (t - ultimoQuadro < 1000 / fps - 2) return;
  var dt = Math.min(100, t - (ultimoT || t)); ultimoT = t; ultimoQuadro = t;
  if (estado === 'noite') cenaNoite(t); else cenaParticulas(t, dt);
}

/* =========================================================
   MODOS
   ========================================================= */
var estado = null, ultimoMov = Date.now(), espiarAte = 0, mudouBrilhoEm = 0;
var PARAMS = {
  aguardando: { vel: 1, alfa: .95, cauda: .42, raioMin: .2 },
  descanso:   { vel: .55, alfa: .7, cauda: .3, raioMin: .2 },
  painel:     { vel: .22, alfa: .3, cauda: .2, raioMin: .08 }
};
function ehNoite() {
  var m = agoraMin(), a = minDia(CFG.acordar), z = minDia(CFG.dormir);
  return z > a ? (m >= z || m < a) : (m >= z && m < a);
}
function noturno() { return ehNoite(); }

function ir(novo) {
  if (estado === novo) return;
  estado = novo;
  document.body.className = 'modo-' + novo + (novo === 'painel' && noturno() ? ' noturno' : '');
  if (PARAMS[novo]) { alvo = PARAMS[novo]; }
  if (novo === 'noite') { brilho(1, 0); }
  else if (novo === 'aguardando') { brilho(45, .35); }
  else if (novo === 'descanso') { brilho(70, .25); }
  else if (novo === 'painel') { if (noturno()) brilho(18, .55); else brilho(170, 0); carregar(); }
}

function decidir() {
  var agora = Date.now();
  if (ehNoite()) {
    if (estado === 'painel' && agora - ultimoMov < 60000) return;     // mexendo no painel à noite
    ir('noite');
    if (espiarAte && agora > espiarAte) { espiarAte = 0; document.body.classList.remove('espiando'); brilho(1, 0); }
    return;
  }
  var manha = agoraMin() < 12 * 60;
  if (manha && ler('acordou') !== hojeStr()) { if (estado !== 'aguardando') ir('aguardando'); return; }
  if (estado === 'painel') { if (agora - ultimoMov > CFG.inativoMin * 60000) ir('descanso'); return; }
  ir('descanso');
}

function espiar() {
  espiarAte = Date.now() + 15000;
  document.body.classList.add('espiando');
  brilho(14, 0);
}

function despertar() {
  guardar('acordou', hojeStr());
  explosao = 1;
  $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on');
  setTimeout(function () { ultimoMov = Date.now(); ir('painel'); }, 700);
  carregar().then(function (d) { setTimeout(function () { falar(d.fala); }, 1200); });
}

function aoMovimento() {
  if (Date.now() - mudouBrilhoEm < 2500) return;   // a própria tela acendendo não conta como movimento
  ultimoMov = Date.now();
  if (estado === 'noite') espiar();
  else if (estado === 'aguardando') despertar();
  else if (estado === 'descanso') ir('painel');
}
window.aoMovimento = aoMovimento;

function aoToque() {
  ultimoMov = Date.now();
  if (estado === 'noite') { document.body.classList.remove('espiando'); espiarAte = 0; ir('painel'); }
  else if (estado === 'aguardando') despertar();
  else if (estado === 'descanso') ir('painel');
}

/* =========================================================
   DETECÇÃO DE MOVIMENTO
   1) Fully Kiosk (se a detecção de movimento dele estiver ligada)
   2) senão, a câmera frontal pelo navegador (as imagens nunca saem do tablet)
   ========================================================= */
function iniciarMovimento() {
  try {
    if (typeof fully !== 'undefined' && fully.bind && fully.getBooleanSetting && String(fully.getBooleanSetting('motionDetection')) === 'true') {
      fully.bind('onMotion', 'window.aoMovimento && window.aoMovimento()');
      return;
    }
  } catch (e) {}
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 160 }, height: { ideal: 120 } }, audio: false })
    .then(function (st) {
      var v = document.createElement('video');
      v.muted = true; v.setAttribute('playsinline', ''); v.srcObject = st; v.play();
      var c = document.createElement('canvas'); c.width = 40; c.height = 30;
      var g = c.getContext('2d', { willReadFrequently: true });
      var ant = null, somaAnt = 0, N = 1200;
      setInterval(function () {
        if (v.readyState < 2) return;
        g.drawImage(v, 0, 0, 40, 30);
        var px = g.getImageData(0, 0, 40, 30).data, cinza = new Float32Array(N), soma = 0, i;
        for (i = 0; i < N; i++) { cinza[i] = px[i * 4] * .3 + px[i * 4 + 1] * .59 + px[i * 4 + 2] * .11; soma += cinza[i]; }
        if (ant) {
          var media = soma / N, desvioGeral = (soma - somaAnt) / N;   // ignora quando a imagem toda clareia/escurece
          var sens = media < 25 ? 9 : media < 60 ? 14 : 22, mud = 0;
          for (i = 0; i < N; i++) if (Math.abs(cinza[i] - ant[i] - desvioGeral) > sens) mud++;
          if (mud > N * .035) aoMovimento();
        }
        ant = cinza; somaAnt = soma;
      }, 350);
    })
    .catch(function (e) { console.warn('Câmera indisponível: ' + e); });
}

/* =========================================================
   RELÓGIO E LOOP
   ========================================================= */
function tick() {
  var d = new Date(), hm = hhmm(d);
  $('hora').innerHTML = dois(d.getHours()) + '<span>:</span>' + dois(d.getMinutes());
  $('horaNoite').textContent = hm;
  $('horaAguarda').textContent = hm;
  $('horaDesc').textContent = hm;
  $('dataNoite').textContent = DSEM[d.getDay()] + ' · ' + d.getDate() + ' ' + MES[d.getMonth()];
  decidir();
  if (d.getSeconds() === 0) {
    proximo();
    aplicarPaletaFundo();
    desloc.x = Math.round((Math.random() - .5) * 24); desloc.y = Math.round((Math.random() - .5) * 18);
    document.documentElement.style.setProperty('--dx', desloc.x + 'px');
    document.documentElement.style.setProperty('--dy', desloc.y + 'px');
  }
}

/* =========================================================
   INÍCIO
   ========================================================= */
$('bFalar').onclick = function (e) { e.stopPropagation(); ultimoMov = Date.now(); status('preparando o resumo…'); carregar().then(function (d) { falar(d.fala); }); };
$('bParar').onclick = function (e) { e.stopPropagation(); parar(); };
$('bEmails').onclick = function (e) {
  e.stopPropagation(); ultimoMov = Date.now(); status('lendo seus e-mails…');
  carregar('escanear').then(function (d) { status(d.adicionados.length ? 'agenda atualizada ✓' : 'nenhum compromisso novo'); });
};
$('cfgOk').onclick = function () {
  CFG.api = $('cfgApi').value.trim(); CFG.k = $('cfgK').value.trim();
  guardar('api', CFG.api); guardar('k', CFG.k);
  $('config').classList.remove('on'); carregar();
};
document.addEventListener('pointerdown', function (e) { telaCheia(); if (!e.target.closest('button, #config')) aoToque(); else ultimoMov = Date.now(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) carregar(); });
window.addEventListener('resize', tamanho);
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function () {};
try { if (navigator.wakeLock && !temFully()) navigator.wakeLock.request('screen'); } catch (e) {}

aplicarPaletaFundo();
tamanho();
tick();
setInterval(tick, 1000);
setInterval(function () { carregar(); }, 10 * 60 * 1000);
carregar();
iniciarMovimento();
requestAnimationFrame(animar);
</script>
</body>
